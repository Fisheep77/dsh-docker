name: Build DeepSeek Harness Latest

on:

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/build-ghcr.yml"

  schedule:
    - cron: "17 5 * * *"
      timezone: "Asia/Tokyo"


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/fisheep77/deepseek-harness


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"


      - name: Get latest DSH version
        id: dsh
        shell: bash
        run: |
          VERSION="$(npm view @deepseek-ai/dsh version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest DSH version: ${VERSION}"


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push
        uses: docker/build-push-action@v6

        with:

          context: .

          push: true

          pull: true

          build-args: |
            CACHE_BUST=${{ github.run_id }}

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:dsh-${{ steps.dsh.outputs.version }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=DeepSeek Harness
            org.opencontainers.image.description=DeepSeek Harness built from the official @deepseek-ai/dsh npm package
            org.opencontainers.image.version=${{ steps.dsh.outputs.version }}
